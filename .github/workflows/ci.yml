name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # "Run workflow" button: on master it also re-deploys

permissions:
  contents: read

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Testcontainers PostgreSQL)
        run: mvn -B verify

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Images are built here, not on the server: Maven and Next.js builds do not fit in < 2 GB RAM.
  publish:
    name: Publish images to ghcr.io
    needs: [api, web]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/apisdsn/web-portofolio-api:latest
            ghcr.io/apisdsn/web-portofolio-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            API_INTERNAL_URL=http://api:8080
          tags: |
            ghcr.io/apisdsn/web-portofolio-web:latest
            ghcr.io/apisdsn/web-portofolio-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to the server
    needs: publish
    runs-on: ubuntu-latest
    environment: production   # same as MoniShield: Settings -> Environments -> production holds the DEPLOY_* secrets
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/web-portofolio' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the deploy secrets are set
        id: secrets
        run: |
          missing=""
          for name in HOST DEPLOY_USER SSH_KEY KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped, secrets not set:$missing (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS; see README, section Deploy)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.secrets.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          # tr: a key pasted from Windows can carry \r line endings, which OpenSSH rejects
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          if ! ssh-keygen -y -P "" -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key, or it has a passphrase (deploy keys must have none)"
            exit 1
          fi
          # The fingerprint is not secret: compare it with `ssh-keygen -lf ~/.ssh/authorized_keys` on the server
          echo "Deploy key: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          echo "Connecting as user: $DEPLOY_USER"
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p $PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes $DEPLOY_USER@$HOST" >> "$GITHUB_ENV"

      - name: Upload the compose file
        if: steps.secrets.outputs.ready == 'true'
        run: $SSH_CMD "mkdir -p '$DEPLOY_DIR' && cat > '$DEPLOY_DIR/docker-compose.yml'" < deploy/docker-compose.server.yml

      - name: Log the server in to ghcr.io (token expires when this job ends)
        if: steps.secrets.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | $SSH_CMD "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: $SSH_CMD "DEPLOY_DIR='$DEPLOY_DIR' PORTFOLIO_TAG='${{ github.sha }}' bash -s" < deploy/remote-deploy.sh

      - name: Log the server out of ghcr.io
        if: always() && steps.secrets.outputs.ready == 'true'
        run: $SSH_CMD "docker logout ghcr.io" || true
